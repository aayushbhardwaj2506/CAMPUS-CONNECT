# DA3 — Neo4j graph database for Campus Connect.
#   docker compose -f docker-compose.neo4j.yml up -d
# Neo4j Browser:  http://localhost:7474   (user: neo4j / password below)
# Bolt (driver):  bolt://localhost:7687
services:
  neo4j:
    image: neo4j:5-community
    container_name: campus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # local development credentials only
      NEO4J_AUTH: neo4j/campus-graph-123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
