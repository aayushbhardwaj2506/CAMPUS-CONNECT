services:
  app:
    build: .
    container_name: vit-social-app
    expose:
      - "3000"
    networks:
      - vit-network

  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - vit-network

networks:
  vit-network: